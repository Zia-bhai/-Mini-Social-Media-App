<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signup • Luxora</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="brand">Luxora</div>

    <h2 class="auth-heading">Create Your Account</h2>

    <div class="auth-card">
      <input type="text" id="signup-name" class="auth-input" placeholder="Full Name" />
      <input type="email" id="signup-email" class="auth-input" placeholder="Email Address" />
      <input type="password" id="signup-password" class="auth-input" placeholder="Password" />

      <button id="signup-btn" class="auth-btn">Sign Up</button>

      <p class="auth-switch">Already have an account? <a href="index.html">Login</a></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
