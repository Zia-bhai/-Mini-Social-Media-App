<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login • Luxora</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="brand">Luxora</div>

    <h2 class="auth-heading">Welcome Back</h2>

    <div class="auth-card">
      <input type="email" id="login-email" class="auth-input" placeholder="Email Address" />
      <input type="password" id="login-password" class="auth-input" placeholder="Password" />

      <button id="login-btn" class="auth-btn">Login</button>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign Up</a></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
